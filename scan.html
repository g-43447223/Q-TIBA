<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-TIBA - Sistem Imbasan Kelewatan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 space-y-4">
    <h1 class="text-2xl font-bold text-center text-blue-600">Sistem Q-TIBA</h1>
    <p class="text-sm text-gray-500 text-center">Imbas Barcode / QR ID Murid Untuk Rekod Kelewatan</p>

    <!-- Status Talian -->
    <div id="status-bar" class="text-xs text-center py-1 px-3 rounded bg-green-100 text-green-800 font-semibold">
      Status: Dalam Talian (Online)
    </div>

    <!-- Kamera Scanner -->
    <div class="overflow-hidden rounded-lg border-2 border-gray-300">
      <div id="reader" style="width: 100%;"></div>
    </div>

    <!-- Pilihan Punca Kelewatan -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Punca Kelewatan:</label>
      <select id="punca-select" class="w-full border border-gray-300 rounded-lg p-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="Bangun Lewat">Bangun Lewat</option>
        <option value="Kesesakan Lalu Lintas">Kesesakan Lalu Lintas</option>
        <option value="Masalah Kenderaan">Masalah Kenderaan</option>
        <option value="Urusan Keluarga">Urusan Keluarga</option>
        <option value="Lain-lain">Lain-lain</option>
      </select>
    </div>

    <!-- Input Manual Fallback -->
    <div class="border-t pt-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan ID Manual:</label>
      <div class="flex gap-2">
        <input type="text" id="manual-id" placeholder="Contoh: M1001" class="flex-1 border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="submitManual()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-semibold">Hantar</button>
      </div>
    </div>

    <!-- Mesej Maklum Balas -->
    <div id="feedback" class="hidden p-3 rounded-lg text-sm text-center font-bold"></div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    const API_URL = "https://script.google.com/macros/s/AKfycbwDPkVY89RfwAbPmYiOWSd8qfcB6vqcRnjaCgNyGmsRZqDF_WsQaX_205UoN8wtpwsZag/exec"; // Masukkan URL deployment Google Apps Script anda
    const SECRET_KEY = "KunciRahsiaSekolah123!"; // Pastikan sama dengan Code.gs
    // =================================================

    let muridDatabase = {};
    let isProcessing = false;

    // Load Data Murid Sasaran untuk Pengecaman Segera
    async function fetchMuridData() {
      if (!API_URL || API_URL.includes("MASUKKAN_URL")) return;
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.muridList) {
          data.muridList.forEach(m => {
            muridDatabase[m.id] = m;
          });
          console.log("Q-TIBA: Data murid berjaya dikemas kini.");
        }
      } catch (err) {
        console.warn("Gagal memuatkan data murid dari server. Menggunakan mod asas.");
      }
    }

    // Fungsi Mengirim Data Ke Google Apps Script
    function sendDataToBackend(payload) {
      const dataToSend = {
        ...payload,
        secret_key: SECRET_KEY
      };

      if (navigator.onLine && API_URL && !API_URL.includes("MASUKKAN_URL")) {
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(dataToSend)
        })
        .then(res => res.json())
        .then(res => {
          if (res.result === "success") {
            showFeedback(`Berjaya direkod: ${payload.nama || payload.id}`, "success");
          } else {
            showFeedback(`Ralat Server: ${res.message || 'Gagal menyimpan'}`, "error");
          }
        })
        .catch(err => {
          console.error("Gagal hantar data:", err);
          saveOffline(dataToSend);
          showFeedback(`Disimpan secara luar talian (Offline)`, "warning");
        });
      } else {
        saveOffline(dataToSend);
        showFeedback(`Tiada sambungan internet. Rekod disimpan secara Offline.`, "warning");
      }
    }

    // Simpan Rekod Luar Talian (Offline Queue)
    function saveOffline(payload) {
      let queue = JSON.parse(localStorage.getItem("qtiba_offline_queue") || "[]");
      queue.push(payload);
      localStorage.setItem("qtiba_offline_queue", JSON.stringify(queue));
    }

    // Sync Rekod Luar Talian Bila Online
    function syncOfflineData() {
      if (!navigator.onLine) return;
      let queue = JSON.parse(localStorage.getItem("qtiba_offline_queue") || "[]");
      if (queue.length === 0) return;

      console.log(`Mengirim ${queue.length} rekod offline...`);
      let remaining = [];

      queue.forEach(item => {
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(item)
        }).catch(() => {
          remaining.push(item);
        });
      });

      localStorage.setItem("qtiba_offline_queue", JSON.stringify(remaining));
    }

    // Proses Hasil Imbasan
    function processScan(studentId) {
      if (isProcessing) return;
      isProcessing = true;

      const cleanId = String(studentId).trim();
      const punca = document.getElementById('punca-select').value;
      const studentInfo = muridDatabase[cleanId] || {};

      const payload = {
        id: cleanId,
        nama: studentInfo.nama || 'Tidak Dikenali',
        kelas: studentInfo.kelas || '-',
        punca: punca
      };

      sendDataToBackend(payload);

      // Elakkan penindanan imbasan berulang (Cooldown 3 saat)
      setTimeout(() => {
        isProcessing = false;
      }, 3000);
    }

    // Submit Manual ID
    function submitManual() {
      const input = document.getElementById('manual-id');
      if (input.value.trim() !== "") {
        processScan(input.value.trim());
        input.value = "";
      }
    }

    // Tunjuk Mesej Maklum Balas UI
    function showFeedback(msg, type) {
      const fb = document.getElementById('feedback');
      fb.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');

      if (type === 'success') {
        fb.classList.add('bg-green-100', 'text-green-800');
      } else if (type === 'error') {
        fb.classList.add('bg-red-100', 'text-red-800');
      } else {
        fb.classList.add('bg-yellow-100', 'text-yellow-800');
      }

      fb.innerText = msg;
      setTimeout(() => {
        fb.classList.add('hidden');
      }, 4000);
    }

    // Kemaskini Status Rangkaian
    function updateOnlineStatus() {
      const bar = document.getElementById('status-bar');
      if (navigator.onLine) {
        bar.className = "text-xs text-center py-1 px-3 rounded bg-green-100 text-green-800 font-semibold";
        bar.innerText = "Status: Dalam Talian (Online)";
        syncOfflineData();
      } else {
        bar.className = "text-xs text-center py-1 px-3 rounded bg-red-100 text-red-800 font-semibold";
        bar.innerText = "Status: Luar Talian (Offline)";
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Basmi Kamera & Mulakan Inisialisasi
    window.onload = () => {
      fetchMuridData();
      updateOnlineStatus();

      const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
      );

      html5QrcodeScanner.render((decodedText) => {
        processScan(decodedText);
      }, (error) => {
        // Abaikan error pengimbasan biasa semasa tiada QR dikesan
      });
    };
  </script>
</body>
</html>
